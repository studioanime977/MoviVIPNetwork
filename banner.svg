<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0d1137;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.10"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.30"/>
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00BFFF" flood-opacity="0.35"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00BFFF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Orbes de luz -->
  <circle cx="1150" cy="80" r="220" fill="url(#orb1)"/>
  <circle cx="120" cy="330" r="200" fill="url(#orb2)"/>
  <circle cx="900" cy="380" r="160" fill="url(#orb2)"/>

  <!-- Línea de separación inferior con gradiente -->
  <rect x="0" y="396" width="1280" height="4" fill="url(#accent)"/>

  <!-- Cuadrícula decorativa sutil -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
  </g>

  <!-- Panel de red decorativo (derecha) -->
  <g transform="translate(960, 60)" opacity="0.85">
    <rect x="0" y="0" width="260" height="280" rx="16" fill="url(#glow)" stroke="#00BFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="130" y="38" font-family="monospace" font-size="13" fill="#00BFFF" text-anchor="middle" letter-spacing="2">DASHBOARD v5.0</text>
    <!-- Barras de estado -->
    <rect x="24" y="60" width="212" height="14" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="24" y="60" width="180" height="14" rx="7" fill="#00BFFF" fill-opacity="0.8"/>
    <text x="24" y="92" font-family="monospace" font-size="11" fill="#8ab4c8">OPENSSH  ·  PUERTO 22</text>
    <rect x="24" y="104" width="212" height="8" rx="4" fill="#ffffff" fill-opacity="0.05"/>
    <text x="24" y="136" font-family="monospace" font-size="11" fill="#8ab4c8">SSL/TLS  ·  PUERTO 443</text>
    <rect x="24" y="148" width="212" height="8" rx="4" fill="#ffffff" fill-opacity="0.05"/>
    <text x="24" y="180" font-family="monospace" font-size="11" fill="#8ab4c8">SLOWDNS  ·  PUERTO 5300</text>
    <rect x="24" y="192" width="212" height="8" rx="4" fill="#ffffff" fill-opacity="0.05"/>
    <text x="24" y="224" font-family="monospace" font-size="11" fill="#8ab4c8">V2RAY/XRAY  ·  8443/9443</text>
    <rect x="24" y="236" width="212" height="8" rx="4" fill="#ffffff" fill-opacity="0.05"/>
    <!-- Estado de seguridad -->
    <text x="24" y="272" font-family="monospace" font-size="12" fill="#7CFC00">▲ SEGURIDAD ACTIVA</text>
    <text x="24" y="260" font-family="monospace" font-size="12" fill="#7CFC00">▲</text>
    <text x="130" y="262" font-family="monospace" font-size="11" fill="#7CFC00" text-anchor="middle">FAIL2BAN + AUDITORÍA OK</text>
  </g>

  <!-- Escudo / Logo -->
  <g filter="url(#shadow)">
    <path d="M90 60 L170 95 L170 180 Q170 265 130 285 Q90 265 90 180 Z" fill="#0d1137" stroke="url(#accent)" stroke-width="3"/>
    <path d="M105 130 L130 155 L155 105" fill="none" stroke="#00BFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 175 L130 150 L155 190" fill="none" stroke="#FFD700" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nombre -->
  <text x="200" y="150" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#ffffff" filter="url(#textGlow)">MOVIVIP</text>
  <text x="200" y="205" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="url(#accent)" letter-spacing="6">NETWORK</text>

  <!-- Tagline -->
  <text x="202" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#8ab4c8" letter-spacing="1">MULTI SCRIPT PREMIUM · VPS UBUNTU</text>

  <!-- Chips de características -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c8d6e5">
    <rect x="202" y="285" width="118" height="26" rx="13" fill="#00BFFF" fill-opacity="0.12" stroke="#00BFFF" stroke-opacity="0.4"/>
    <text x="261" y="302" text-anchor="middle" fill="#00BFFF">🔐 10 Protocolos</text>
    <rect x="330" y="285" width="128" height="26" rx="13" fill="#7B68EE" fill-opacity="0.12" stroke="#7B68EE" stroke-opacity="0.4"/>
    <text x="394" y="302" text-anchor="middle" fill="#b3a8ff">🛡️ Seguridad Total</text>
    <rect x="468" y="285" width="126" height="26" rx="13" fill="#FFD700" fill-opacity="0.10" stroke="#FFD700" stroke-opacity="0.35"/>
    <text x="531" y="302" text-anchor="middle" fill="#FFD700">📊 Consumo Real</text>
    <rect x="604" y="285" width="118" height="26" rx="13" fill="#7CFC00" fill-opacity="0.10" stroke="#7CFC00" stroke-opacity="0.35"/>
    <text x="663" y="302" text-anchor="middle" fill="#7CFC00">🤖 Bots Telegram</text>
  </g>

  <!-- Versión -->
  <text x="202" y="348" font-family="monospace" font-size="15" fill="#5a7a8a">PREMIUM EDITION</text>
  <rect x="340" y="333" width="86" height="30" rx="6" fill="#00BFFF" fill-opacity="0.15" stroke="#00BFFF" stroke-width="1.5"/>
  <text x="383" y="353" font-family="monospace" font-size="16" font-weight="bold" fill="#00BFFF" text-anchor="middle">v5.0</text>
</svg>
