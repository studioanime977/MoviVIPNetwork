<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoviVIP Web Panel v2 — Admin Total</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
:root{
  --bg:#0b0f14; --bg2:#0f1520; --panel:#111827; --panel2:#151d2c; --border:#1f2a3d;
  --txt:#d8e2f0; --dim:#8aa0bf; --accent:#22d3ee; --green:#34d399; --red:#f87171;
  --amber:#fbbf24; --purple:#a78bfa; --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:Segoe UI,system-ui,-apple-system,sans-serif;font-size:14px}
.hidden{display:none!important}
a{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#24334d;border-radius:8px}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#0d1b2a 0%,#0b0f14 60%)}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:36px 38px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:26px;text-align:center;margin-bottom:6px}
.login-title{text-align:center;font-size:19px;font-weight:700;margin-bottom:4px;background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-size:14px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#0891b2,#0d9488);border:none;color:#fff}
.btn.primary:hover{filter:brightness(1.15);color:#fff}
.btn.danger{color:var(--red)} .btn.danger:hover{border-color:var(--red)}
.btn.green{color:var(--green)} .btn.green:hover{border-color:var(--green)}
.btn.amber{color:var(--amber)} .btn.amber:hover{border-color:var(--amber)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.login-btn{width:100%;padding:11px;font-size:15px;margin-top:6px}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* ── LAYOUT ── */
#app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.brand .b1{font-size:18px;font-weight:800;background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .b2{font-size:11px;color:var(--dim);margin-top:2px}
.nav{padding:12px 8px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;color:var(--dim);font-weight:600;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(52,211,153,.10));color:var(--accent);border:1px solid rgba(34,211,238,.25)}
.nav-item .ico{width:20px;text-align:center}
aside .foot{padding:14px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;font-weight:700;flex:1}
.topbar .meta{color:var(--dim);font-size:12px}
.topbar .user-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);padding:4px 6px 4px 12px;border-radius:20px;font-size:12px}
.topbar .user-chip .btn{padding:4px 10px;font-size:11px;color:var(--green);border-color:rgba(52,211,153,.4)}
.topbar .user-chip .btn:hover{border-color:var(--green)}
.content{padding:22px;overflow-y:auto;flex:1}

/* ── CARDS ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card .ck{font-size:12px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card .cv{font-size:22px;font-weight:800}
.card .cv small{font-size:12px;color:var(--dim);font-weight:500}
.bar{height:6px;border-radius:6px;background:#1c2740;overflow:hidden;margin-top:10px}
.bar>div{height:100%;border-radius:6px;background:linear-gradient(90deg,#22d3ee,#34d399)}
.bar>div.warn{background:linear-gradient(90deg,#fbbf24,#f87171)}

/* ── SECTIONS / TABLES ── */
.section-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid #152033;vertical-align:middle}
tr:hover td{background:rgba(34,211,238,.04)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.on{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.4)}
.badge.off{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.35)}
.badge.active{background:rgba(34,211,238,.15);color:var(--accent);border:1px solid rgba(34,211,238,.4)}
.badge.dim{background:#1c2740;color:var(--dim)}
.mono{font-family:Consolas,monospace;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--border);padding:4px 10px;border-radius:14px;font-size:11px;white-space:nowrap}
.chip b{color:var(--accent)}
.cred-chips{display:flex;flex-wrap:wrap;gap:8px}
.cred-chips .chip{cursor:pointer;padding:7px 12px;font-size:12px;transition:.15s}
.cred-chips .chip:hover{border-color:var(--accent)}
.cred-chips .chip.on{background:var(--accent);color:#04121a;border-color:var(--accent);font-weight:700}
.cred-chips .chip.off{opacity:.55}
.cred-chips .chip.off:hover{border-color:var(--border);cursor:not-allowed}
.cred-grp{flex-basis:100%;font-size:10px;letter-spacing:1px;color:var(--dim);margin-top:6px;text-transform:uppercase;font-weight:700}
.cred-grp:first-child{margin-top:0}
.panel-info{background:rgba(255,167,38,.08);border:1px solid rgba(255,167,38,.35);color:#fbbf24;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:10px}
.panel-info.warn{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.4);color:#f87171}
.toast.info{border-left-color:#fbbf24}
.cred-line{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
.cred-line label{min-width:110px;font-size:11px;color:var(--dim);text-transform:uppercase}
.cred-line code{flex:1;overflow-x:auto;font-size:12px;word-break:break-all}
.proto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.proto-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.proto-card:hover{border-color:rgba(34,211,238,.45)}
.proto-card .ph{display:flex;align-items:center;gap:10px}
.proto-card .ph .em{font-size:22px}
.proto-card .ph .nm{font-weight:700;font-size:15px}
.proto-card .pd{font-size:12px;color:var(--dim);flex:1}
.proto-card .pu{font-size:11px;font-family:Consolas,monospace;color:var(--amber)}
.proto-card .row{display:flex;gap:6px;justify-content:space-between;align-items:center}
.proto-card .btn[data-web]{color:var(--accent);border-color:rgba(34,211,238,.5)}
.proto-card .btn[data-web]:hover{border-color:var(--accent);background:rgba(34,211,238,.08)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(3,6,10,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:640px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column}
.modal.lg{width:860px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal .mh h2{font-size:16px}
.modal .mb{padding:18px 20px;overflow-y:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.x{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.x:hover{color:var(--txt)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-row .field{margin-bottom:0}
select.field-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-size:14px;outline:none}
pre.tpl{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:56vh;overflow:auto}

/* ── TERMINAL ── */
.term-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.term-toolbar input[type=text]{flex:1;min-width:220px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-family:Consolas,monospace;font-size:13px;outline:none}
.term-toolbar input[type=text]:focus{border-color:var(--accent)}
#term-box{background:#0a0e14;border:1px solid var(--border);border-radius:var(--radius);padding:6px;height:62vh;overflow:hidden}
.term-status{font-size:12px;color:var(--dim);margin-top:8px}
.term-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.term-quick .btn{padding:4px 10px;font-size:11px}

/* ── TOAST ── */
#toasts{position:fixed;bottom:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .25s}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.muted{color:var(--dim);font-size:12px}
.text-err{color:var(--red)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.right{text-align:right}
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="login">
  <div class="login-card">
    <div class="logo">◎</div>
    <div class="login-title">MoviVIP Network — Web Panel</div>
    <div class="login-sub">Panel de administración total · v2.0 · solo root</div>
    <div class="field"><label>Usuario</label><input id="li_user" value="root" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input id="li_pass" type="password" autocomplete="current-password" placeholder="Contraseña de root del servidor"></div>
    <button class="btn primary login-btn" id="li_btn">Ingresar al panel</button>
    <div class="login-err" id="li_err"></div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="b1">◎ MoviVIP</div><div class="b2">Web Panel v2 · Webmin-style</div></div>
    <div class="nav">
      <div class="nav-item active" data-view="dashboard"><span class="ico">📊</span> Dashboard</div>
      <div class="nav-item" data-view="usuarios"><span class="ico">👥</span> Usuarios</div>
      <div class="nav-item" data-view="protocolos"><span class="ico">📡</span> Protocolos</div>
      <div class="nav-item" data-view="herramientas"><span class="ico">🧰</span> Herramientas</div>
      <div class="nav-item" data-view="terminal"><span class="ico">🖥️</span> Terminal</div>
      <div class="nav-item" data-view="servicios"><span class="ico">⚙️</span> Servicios</div>
      <div class="nav-item" data-view="logs"><span class="ico">📜</span> Logs</div>
      <div class="nav-item" data-view="historial"><span class="ico">🕘</span> Historial</div>
    </div>
    <div class="foot">Movimiento continuo · <span id="foot_ver">v2.0.0</span><br>Servidor: <span id="foot_ip">—</span></div>
  </aside>

  <main>
    <div class="topbar">
      <h1 id="view_title">Dashboard</h1>
      <span class="meta" id="tb_meta"></span>
      <div class="user-chip">👑 root <button class="btn small" id="tb_logout" title="Cerrar sesión">🚪 Salir</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- ═══════ TOASTS ═══════ -->
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
